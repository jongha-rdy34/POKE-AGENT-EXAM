# v2 (2026-11-27): v1의 YAML 파싱 오류(S3 B) 수정, S3 A 문장에 기술 추가(정상 구동 수정 요청에 따라 반영, 사용자 최종 확인 필요), B 입력 문장을 화면 예시 칩과 같은 형식으로 명시.
# v1 (2026-11-27 확정: 시나리오 5개). 두 앱에 같은 대전 상황을 쓴다.
# 포켓몬은 A의 DB에서 in_champions=1인 것만 골랐다(챔피언스 싱글 기준).
# 스피드 종족값: 포푸니크 120, 팬텀 110, 한카리아스 102.
version: 2
status: approved
llm_call_policy: 시나리오마다 앱 LLM 호출은 한 번. 데스크톱에서 실행한 같은 화면을 390×844로 바꿔 모바일 캡처를 얻는다(무료 한도 대비)
ruleset: {game: champions, battle: single, pick: 3}
app_llm: {provider: gemini-openai-compatible, model: gemini-3.5-flash}   # 두 앱 동일
viewports:
  desktop: {width: 1440, height: 900}
  mobile: {width: 390, height: 844}
capture_limit_per_scenario_viewport: 2   # 판정 패킷 크기를 맞추기 위한 상한

shared_situation:
  my_team: [한카리아스, 망나뇽, 어흥염, 대도각참, 팬텀, 워시로토무]
  opp_team: [포푸니크, 리자몽, 마기라스, 갸라도스, 님피아, 엘풍]

scenarios:
  S1_first_view:
    goal: 처음 들어온 사용자가 무슨 서비스인지 이해할 수 있는가
    rubric_focus: [usability, ui]
    A: [접속(초대 토큰 쿠키 발급), 첫 화면]
    B: [접속, 첫 화면]

  S2_core_main:
    goal: 같은 대전 상황으로 주 기능을 한 번 수행한다
    rubric_focus: [accuracy, purpose_fit]
    A:
      text: "내 한카리아스가 상대 포푸니크보다 늦게 움직였고, 인파이트 한 방에 쓰러졌어"
      steps: [입력 → 복기하기, 확인 화면, 이대로 복기 → 결과]
    B:
      steps: ["챔피언스·싱글 6→3", "직접 선택으로 my_team·opp_team 입력", "메가스톤: 없음", "선출 추천 받기 → 결과"]

  S3_core_variant:
    goal: 다른 대면 하나로 핵심 계산을 다시 본다(버팀·스피드)
    rubric_focus: [accuracy]
    A:
      text: "상대 포푸니크가 내 팬텀보다 먼저 지옥찌르기를 썼는데, 내 팬텀은 HP 25~50% 남기고 버텼어"   # 지옥찌르기(악)→팬텀 2배
      steps: [입력 → 복기하기, 이대로 복기 → 결과]
    B:
      message: "상대 포푸니크한테 내 팬텀이 먼저 때릴 수 있어? 뭐 써야 돼?"   # S2와 같은 대화(session_id)에서
      steps: ["S2 대화에 이어 위 문장 전송", "결과"]

  S4_bad_input:
    goal: 잘못된 입력·경계 사례 처리
    rubric_focus: [usability, code]
    cases:
      - id: unknown_name
        A: "내 피카츄몽이 상대 포푸니크한테 한 방에 쓰러졌어"
        B: 대화로 입력 "상대 팀은 피카츄몽, 리자몽, 마기라스, 갸라도스, 님피아, 엘풍"
      - id: empty
        A: 빈 입력으로 복기하기
        B: 팀을 비운 채 선출 추천 받기
      - id: rule_mismatch
        A: "내 팬텀이 지진으로 상대 리자몽을 공격했어"   # 면역(비행) 조합
        B: 상대 팀 5마리만 입력하고 선출 추천 받기

  S5_revise_and_rerun:
    goal: 결과를 본 뒤 조건을 바꿔 다시 해 볼 수 있는가
    rubric_focus: [usability, purpose_fit]
    A:
      steps: ["S2 결과에서 조건 고치기 / 더 정확하게 적기", "내 한카리아스: 명랑, 스피드 SP 32", "다시 복기 → 결과"]
    B:
      message: "상대 엘풍 대신 워시로토무로 바꿔서 다시 짜줘"   # S2와 같은 대화에서
      steps: ["S2 대화에 이어 위 문장 전송", "결과"]
